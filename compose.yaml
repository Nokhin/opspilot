services:
  opspilot:
    build: .
    ports:
      - "127.0.0.1:${OPSPILOT_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      OPSPILOT_DATA_DIR: /app/var
      OPSPILOT_CORPUS_DIR: /app/corpus/policies
    volumes:
      - opspilot-data:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 128
    restart: unless-stopped

volumes:
  opspilot-data:
