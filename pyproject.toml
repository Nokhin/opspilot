[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "1.0.0"
description = "Evidence-grounded operational incident intelligence with read-only tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.138.1",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "httpx==0.28.1",
  "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.0"]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.setuptools.package-data]
opspilot = ["ui/*", "data/*.sql", "evaluation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

