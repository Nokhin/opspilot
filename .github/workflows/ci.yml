name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      OPSPILOT_LLM_PROVIDER: extractive
      OPSPILOT_EMBEDDING_PROVIDER: tfidf
      OPSPILOT_LLM_API_KEY: ""
      OPSPILOT_EMBEDDING_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Configure isolated data directory
        run: echo "OPSPILOT_DATA_DIR=$RUNNER_TEMP/opspilot-data" >> "$GITHUB_ENV"
      - name: Check complete publication history
        run: python scripts/check_publication.py --repository .
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: |
          mkdir -p var/ci
          pytest -q --junitxml=var/ci/pytest.xml
      - name: Bootstrap isolated synthetic stores
        run: python -m opspilot.cli bootstrap
      - name: Evaluate current and legacy cases
        run: |
          python -m opspilot.cli evaluate --cases opspilot/evaluation/cases_v1_1.json --output var/ci/current
          python -m opspilot.cli evaluate --cases opspilot/evaluation/cases.json --output var/ci/legacy
      - name: Require complete passing offline reports
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          for name, case_file in (
              ("current", "cases_v1_1.json"), ("legacy", "cases.json")
          ):
              source = Path("opspilot/evaluation") / case_file
              expected_ids = {case["id"] for case in json.loads(source.read_text())}
              report = json.loads(Path(f"var/ci/{name}/results.json").read_text())
              rows, summary, manifest = report["cases"], report["summary"], report["manifest"]
              valid = (
                  len(expected_ids) == len(rows) == summary["cases"] == summary["passed"] == 50
                  and {row["id"] for row in rows} == expected_ids
                  and all(row["passed"] is True and not row["failures"] for row in rows)
                  and summary["end_to_end_pass_rate"] == 1.0
                  and summary["input_tokens"] == summary["output_tokens"] == 0
                  and manifest["mode"] == "extractive"
                  and manifest["embedding"] == "tfidf-word-v1"
                  and manifest["cases_sha256"] == hashlib.sha256(source.read_bytes()).hexdigest()
              )
              if not valid:
                  raise SystemExit(f"{name}: incomplete, failed or non-offline evaluation")
              print(f"{name}: 50/50 offline cases passed")
          PY
      - name: Normalize and check artifact metadata
        id: artifact_privacy
        if: always()
        run: |
          if [ -f var/ci/pytest.xml ]; then
            python scripts/sanitize_junit.py var/ci/pytest.xml
          fi
          if [ -d var/ci ]; then
            python scripts/check_publication.py --directory var/ci
          fi
      - name: Preserve test and evaluation reports
        if: ${{ always() && steps.artifact_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-python-${{ matrix.python }}
          path: var/ci/
          if-no-files-found: warn
          retention-days: 14
